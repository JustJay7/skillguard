# Dedicated x86 cloud VM; no host mounts or forwarded provider environment.
minimumLimaVersion: 2.2.0
vmType: qemu
arch: x86_64
cpus: 2
memory: 2GiB
disk: 12GiB
images:
- location: https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-amd64-20260712-2537.qcow2
  arch: x86_64
  digest: sha512:7ae53e9dbee282bfc16f289dec483dde3a8598769c38a267948310f7a2a52c662620198603bc52c142627efba379863d16079698a10b34102d55bcedd40e8d32
mounts: []
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
containerd:
  system: false
  user: false
propagateProxyEnv: false
portForwards:
- guestIP: 0.0.0.0
  guestIPMustBeZero: false
  guestPortRange:
  - 1
  - 65535
  proto: any
  ignore: true
provision:
- mode: system
  script: '#!/bin/sh

    set -eu

    apt-get update

    env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
    strace python3 curl ca-certificates

    install -m 0755 -d /etc/apt/keyrings

    curl --fail --silent --show-error --location https://download.docker.com/linux/debian/gpg
    -o /etc/apt/keyrings/docker.asc

    chmod a+r /etc/apt/keyrings/docker.asc

    cat > /etc/apt/sources.list.d/docker.sources <<''DOCKER''

    Types: deb

    URIs: https://download.docker.com/linux/debian

    Suites: trixie

    Components: stable

    Architectures: amd64

    Signed-By: /etc/apt/keyrings/docker.asc

    DOCKER

    apt-get update

    env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
    docker-ce=5:29.8.2-1~debian.13~trixie docker-ce-cli=5:29.8.2-1~debian.13~trixie
    containerd.io=2.3.6-1~debian.13~trixie docker-compose-plugin=5.6.0-1~debian.13~trixie

    systemctl enable --now docker

    curl --fail --silent --show-error --location https://github.com/NVIDIA/OpenShell/releases/download/v0.1.2/openshell_0.1.2-1_amd64.deb
    -o /tmp/openshell_0.1.2-1_amd64.deb

    echo ''1f5416ea08f32fdc621f20a2cc0324298e60aba8bbe996459d9e3b44195f23df  /tmp/openshell_0.1.2-1_amd64.deb''
    | sha256sum -c -

    env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
    /tmp/openshell_0.1.2-1_amd64.deb

    curl --fail --silent --show-error --location https://github.com/draios/sysdig/releases/download/0.41.4/sysdig-0.41.4-x86_64.deb
    -o /tmp/sysdig-0.41.4-x86_64.deb

    echo ''efbd2ac6ebb155d68bc2a2509d02b70d6496ba6d0f11b6e9f0c9f3bd6c41f89d  /tmp/sysdig-0.41.4-x86_64.deb''
    | sha256sum -c -

    install -m 0700 -d /opt/skillguard-sysdig

    # Use the upstream standalone binary and modern BPF. No DKMS/postinstall.

    dpkg-deb -x /tmp/sysdig-0.41.4-x86_64.deb /opt/skillguard-sysdig


    apt-get install -y --no-install-recommends python3-venv

    python3 -m venv /opt/skillguard-harbor

    /opt/skillguard-harbor/bin/pip install harbor==0.13.2

    '
